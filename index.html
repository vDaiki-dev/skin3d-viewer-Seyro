<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skin3D Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');
    :root {
      --orange:#FF6A00; --orange-dim:#C24D00; --orange-glow:#FF6A0055;
      --bg:#0D0D0D; --bg2:#141414; --bg3:#1C1C1C; --panel:#191919;
      --border:#2A2A2A; --text:#E0E0E0; --text-dim:#888; --pixel:2px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--bg);color:var(--text);font-family:'VT323',monospace;font-size:20px;min-height:100vh;overflow-x:hidden}
    body::after{content:'';pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,rgba(0,0,0,0.07) 3px,rgba(0,0,0,0.07) 4px);z-index:9999}
    header{padding:18px 28px;display:flex;align-items:center;gap:18px;border-bottom:var(--pixel) solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:100}
    .logo{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--orange);text-shadow:3px 3px 0 var(--orange-dim),0 0 18px var(--orange-glow);letter-spacing:1px;line-height:1.6}
    .logo span{color:#fff}
    header nav{margin-left:auto;display:flex;gap:8px}
    .nav-btn{font-family:'VT323',monospace;font-size:18px;background:none;border:var(--pixel) solid var(--border);color:var(--text-dim);padding:5px 14px;cursor:pointer;transition:color .1s,border-color .1s,background .1s;text-transform:uppercase}
    .nav-btn:hover,.nav-btn.active{color:var(--orange);border-color:var(--orange);background:#FF6A0012}
    main{display:grid;grid-template-columns:280px 1fr 250px;gap:0;height:calc(100vh - 61px)}
    .left-panel,.right-panel{background:var(--panel);border-right:var(--pixel) solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
    .right-panel{border-right:none;border-left:var(--pixel) solid var(--border)}
    .section{border-bottom:var(--pixel) solid var(--border);padding:14px}
    .section-title{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--orange);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .section-title::after{content:'';flex:1;height:var(--pixel);background:var(--border)}
    .px-input{width:100%;background:var(--bg3);border:var(--pixel) solid var(--border);color:var(--text);font-family:'VT323',monospace;font-size:20px;padding:8px 12px;outline:none;transition:border-color .1s}
    .px-input:focus{border-color:var(--orange)}
    .px-input::placeholder{color:var(--text-dim)}
    .px-btn{font-family:'Press Start 2P',monospace;font-size:8px;background:var(--orange);color:#000;border:none;padding:10px 16px;cursor:pointer;width:100%;margin-top:8px;text-transform:uppercase;letter-spacing:1px;transition:background .1s,transform .05s;box-shadow:3px 3px 0 var(--orange-dim)}
    .px-btn:hover{background:#ff8c33}
    .px-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--orange-dim)}
    .px-btn.secondary{background:var(--bg3);color:var(--orange);border:var(--pixel) solid var(--orange)}
    .px-btn.secondary:hover{background:#FF6A0018}
    .input-row{display:flex;gap:6px}
    .input-row .px-input{flex:1}
    .input-row .px-btn{width:auto;margin-top:0;padding:8px 12px}
    .upload-zone{border:var(--pixel) dashed var(--border);background:var(--bg3);padding:18px 10px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;font-size:17px;color:var(--text-dim);line-height:1.6}
    .upload-zone:hover,.upload-zone.drag-over{border-color:var(--orange);background:#FF6A000A;color:var(--text)}
    .upload-zone .icon{font-size:24px;display:block;margin-bottom:4px}
    #file-input,#cape-input{display:none}
    .slider-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;font-size:17px}
    .slider-row label{color:var(--text-dim)}
    .slider-row .val{color:var(--orange);min-width:38px;text-align:right}
    input[type=range]{width:100%;accent-color:var(--orange);cursor:pointer;margin-top:2px}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:18px;color:var(--text-dim)}
    .toggle{width:36px;height:18px;background:var(--bg3);border:var(--pixel) solid var(--border);position:relative;cursor:pointer;transition:background .15s,border-color .15s}
    .toggle.on{background:var(--orange);border-color:var(--orange-dim)}
    .toggle::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:#fff;transition:left .15s}
    .toggle.on::after{left:22px}
    .anim-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .anim-btn{font-family:'Press Start 2P',monospace;font-size:6px;background:var(--bg3);border:var(--pixel) solid var(--border);color:var(--text-dim);padding:9px 4px;cursor:pointer;text-align:center;transition:all .1s;line-height:1.8}
    .anim-btn:hover{border-color:var(--orange);color:var(--orange)}
    .anim-btn.active{background:#FF6A0018;border-color:var(--orange);color:var(--orange)}
    .layer-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #222;font-size:16px}
    .layer-dot{width:10px;height:10px;border:var(--pixel) solid;flex-shrink:0}
    .layer-name{flex:1;color:var(--text-dim)}
    .layer-offset{color:var(--orange);font-size:15px;width:40px;text-align:right}
    .center-area{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
    .center-area::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:32px 32px;opacity:.15;pointer-events:none}
    #viewer-container{position:relative;width:420px;height:560px;border:var(--pixel) solid var(--border)}
    #skin-canvas{width:100%;height:100%;display:block}
    #empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none}
    .empty-icon{font-size:48px;opacity:.3}
    #empty-state p{font-family:'Press Start 2P',monospace;font-size:7px;color:var(--text-dim);text-align:center;line-height:2}
    .bottom-bar{position:absolute;bottom:0;left:0;right:0;background:#0D0D0Dcc;border-top:var(--pixel) solid var(--border);padding:8px 18px;display:flex;align-items:center;gap:16px;font-size:16px;color:var(--text-dim);backdrop-filter:blur(4px)}
    .stat{display:flex;align-items:center;gap:5px}
    .stat-val{color:var(--orange)}
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel);border:var(--pixel) solid var(--orange);color:var(--text);font-family:'Press Start 2P',monospace;font-size:7px;padding:12px 20px;z-index:9998;transition:transform .25s;pointer-events:none;box-shadow:4px 4px 0 var(--orange-dim);white-space:nowrap}
    #toast.show{transform:translateX(-50%) translateY(0)}
    .status-dot{width:8px;height:8px;background:var(--border);display:inline-block;margin-right:6px;animation:blink 1s step-end infinite}
    .status-dot.loading{background:var(--orange)}
    .status-dot.ok{background:#4CAF50;animation:none}
    .status-dot.err{background:#f44;animation:none}
    @keyframes blink{50%{opacity:0}}
    .color-swatch{display:inline-block;width:16px;height:16px;border:var(--pixel) solid var(--border);vertical-align:middle;margin-right:4px;cursor:pointer}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:var(--bg2)}
    ::-webkit-scrollbar-thumb{background:var(--border)}
    ::-webkit-scrollbar-thumb:hover{background:var(--orange-dim)}
    @media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:auto 360px auto}#viewer-container{width:280px;height:360px}}
  </style>
</head>
<body>
<header>
  <div class="logo">SKIN<span>3D</span><br>VIEWER</div>
  <nav>
    <button class="nav-btn active" id="btn-viewer" onclick="setMode('viewer')">VIEWER</button>
    <button class="nav-btn" id="btn-layers" onclick="setMode('layers')">LAYERS</button>
    <button class="nav-btn" id="btn-debug" onclick="setMode('debug')">DEBUG</button>
  </nav>
</header>
<main>
  <aside class="left-panel">
    <div class="section">
      <div class="section-title">Username</div>
      <div class="input-row">
        <input class="px-input" id="username-input" type="text" placeholder="Notch" />
        <button class="px-btn" style="width:auto;margin-top:0;padding:8px 12px;font-size:7px" onclick="loadByUsername()">▶</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Upload Skin</div>
      <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <span class="icon">⬆</span>Drop .png here<br>or click to browse
      </div>
      <input type="file" id="file-input" accept=".png,image/png" />
    </div>
    <div class="section">
      <div class="section-title">Cape</div>
      <div class="upload-zone" style="padding:12px 10px;font-size:16px" onclick="document.getElementById('cape-input').click()">
        <span class="icon" style="font-size:20px">🧣</span>Upload cape .png
      </div>
      <input type="file" id="cape-input" accept=".png,image/png" />
    </div>
    <div class="section">
      <div class="section-title">Quick Load</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="px-btn secondary" onclick="loadPreset('Notch')">NOTCH</button>
        <button class="px-btn secondary" onclick="loadPreset('jeb_')">JEB_</button>
        <button class="px-btn secondary" onclick="loadPreset('Dream')">DREAM</button>
        <button class="px-btn secondary" onclick="loadPreset('Technoblade')">TECHNOBLADE</button>
      </div>
    </div>
  </aside>

  <section class="center-area">
    <div id="viewer-container">
      <canvas id="skin-canvas"></canvas>
      <div id="empty-state">
        <div class="empty-icon">🎮</div>
        <p>NO SKIN LOADED<br>SEARCH OR UPLOAD<br>TO BEGIN</p>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="stat"><span class="status-dot" id="status-dot"></span><span id="status-text">READY</span></div>
      <div class="stat" style="margin-left:auto">FPS <span class="stat-val" id="fps-val">--</span></div>
      <div class="stat">ROT <span class="stat-val" id="rot-val">0°</span></div>
      <div class="stat">ANIM <span class="stat-val" id="anim-val">NONE</span></div>
    </div>
  </section>

  <aside class="right-panel">
    <div class="section">
      <div class="section-title">Animation</div>
      <div class="anim-grid">
        <button class="anim-btn active" onclick="setAnim('idle')" id="anim-idle">IDLE</button>
        <button class="anim-btn" onclick="setAnim('walk')" id="anim-walk">WALK</button>
        <button class="anim-btn" onclick="setAnim('run')" id="anim-run">RUN</button>
        <button class="anim-btn" onclick="setAnim('wave')" id="anim-wave">WAVE</button>
        <button class="anim-btn" onclick="setAnim('fly')" id="anim-fly">FLY</button>
        <button class="anim-btn" onclick="setAnim('none')" id="anim-none">STOP</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Controls</div>
      <div class="toggle-row"><span>Auto rotate</span><div class="toggle on" id="toggle-rotate" onclick="toggleOpt('rotate')"></div></div>
      <div class="toggle-row"><span>Show cape</span><div class="toggle on" id="toggle-cape" onclick="toggleOpt('cape')"></div></div>
      <div class="toggle-row"><span>Slim model</span><div class="toggle" id="toggle-slim" onclick="toggleOpt('slim')"></div></div>
    </div>
    <div class="section">
      <div class="section-title">Lighting</div>
      <div class="slider-row"><label>Ambient</label><span class="val" id="val-ambient">0.6</span></div>
      <input type="range" min="0" max="100" value="60" oninput="updateLight('ambient',this.value)">
      <div class="slider-row" style="margin-top:10px"><label>Point Light</label><span class="val" id="val-point">1.0</span></div>
      <input type="range" min="0" max="200" value="100" oninput="updateLight('point',this.value)">
      <div class="slider-row" style="margin-top:10px"><label>Light Color</label>
        <span>
          <span class="color-swatch" style="background:#fff" onclick="setLightColor('#ffffff','white')"></span>
          <span class="color-swatch" style="background:#FF6A00" onclick="setLightColor('#ff6a00','orange')"></span>
          <span class="color-swatch" style="background:#4499ff" onclick="setLightColor('#4499ff','blue')"></span>
          <span class="color-swatch" style="background:#44ff88" onclick="setLightColor('#44ff88','green')"></span>
        </span>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Camera</div>
      <div class="slider-row"><label>Zoom</label><span class="val" id="val-zoom">40</span></div>
      <input type="range" min="15" max="90" value="40" oninput="updateCamera('zoom',this.value)">
      <div class="slider-row" style="margin-top:10px"><label>Anim Speed</label><span class="val" id="val-speed">1.0x</span></div>
      <input type="range" min="10" max="300" value="100" oninput="updateCamera('speed',this.value)">
    </div>
    <div class="section" id="layer-section">
      <div class="section-title">3D Layers</div>
      <div id="layer-list"><div style="color:var(--text-dim);font-size:16px">Load a skin first</div></div>
      <div class="slider-row" style="margin-top:12px"><label>Explode</label><span class="val" id="val-explode">0</span></div>
      <input type="range" min="0" max="100" value="0" oninput="explodeLayers(this.value)">
    </div>
    <div class="section">
      <div class="section-title">Export</div>
      <button class="px-btn secondary" onclick="exportPNG()">SAVE PNG</button>
    </div>
  </aside>
</main>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

/* ── STATE ── */
let scene, camera, renderer, controls;
let playerGroup = null;
let parts = {}; // head, body, rArm, lArm, rLeg, lLeg + their outers
let capeMesh = null;
let currentAnim = 'idle';
let animTime = 0;
let skinLoaded = false;
let autoRotate = true;
let showCape = true;
let isSlim = false;
let ambientLight, pointLight;
let animSpeed = 1.0;
let fpsFrames = 0, fpsLast = performance.now(), fpsVal = 0;
let lastTime = performance.now();

/* ── INIT ── */
function init() {
  const canvas = document.getElementById('skin-canvas');
  const cont = document.getElementById('viewer-container');
  const W = cont.clientWidth, H = cont.clientHeight;

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(40, W/H, 0.1, 1000);
  camera.position.set(0, 0, 5);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 2;
  controls.maxDistance = 12;
  controls.target.set(0, 0, 0);
  controls.update();

  ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  pointLight = new THREE.PointLight(0xffffff, 1.0, 100);
  pointLight.position.set(3, 5, 4);
  pointLight.castShadow = true;
  scene.add(pointLight);

  const fill = new THREE.DirectionalLight(0xff6a00, 0.15);
  fill.position.set(-3, -1, -2);
  scene.add(fill);

  // shadow floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(10,10),
    new THREE.ShadowMaterial({ opacity: 0.15 })
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -1.6;
  floor.receiveShadow = true;
  scene.add(floor);

  window.addEventListener('resize', () => {
    const W2 = cont.clientWidth, H2 = cont.clientHeight;
    renderer.setSize(W2, H2);
    camera.aspect = W2/H2;
    camera.updateProjectionMatrix();
  });

  requestAnimationFrame(loop);
}

/* ── UV HELPERS ──
   Minecraft skin atlas (64x64):
   makeFaceUVs(geo, faceIndex, u, v, w, h) where u,v,w,h are in pixel coords
   Three.js BoxGeometry face order: +x, -x, +y, -y, +z, -z
*/
function setFaceUVs(geo, faceIdx, u, v, w, h, texW=64, texH=64) {
  const uvAttr = geo.attributes.uv;
  const base = faceIdx * 6;
  const u0 = u/texW,      v0 = 1-(v+h)/texH;
  const u1 = (u+w)/texW,  v1 = 1-v/texH;
  // three.js winding for each face: 2 triangles, 6 verts
  // bl, br, tl,  br, tr, tl
  const pts = [
    [u0,v0],[u1,v0],[u0,v1],
    [u1,v0],[u1,v1],[u0,v1]
  ];
  for(let i=0;i<6;i++) uvAttr.setXY(base+i, pts[i][0], pts[i][1]);
  uvAttr.needsUpdate = true;
}

/* Build a minecraft body part.
   Minecraft face layout for a part at texture offset (tx,ty) with size (ow,oh,od):
     top:    (tx+od,        ty,       ow, od)
     bottom: (tx+od+ow,     ty,       ow, od)
     right:  (tx,           ty+od,    od, oh)   ← -X face
     front:  (tx+od,        ty+od,    ow, oh)   ← +Z face
     left:   (tx+od+ow,     ty+od,    od, oh)   ← +X face
     back:   (tx+od+ow+od,  ty+od,    ow, oh)   ← -Z face

   Three.js BoxGeometry face indices: 0=+X, 1=-X, 2=+Y, 3=-Y, 4=+Z, 5=-Z
*/
function buildPart(ow, oh, od, tx, ty, mat, scale=0.125) {
  const geo = new THREE.BoxGeometry(ow*scale, oh*scale, od*scale);

  // +X = left in MC  ← actually MC "left" side
  setFaceUVs(geo, 0, tx+od+ow, ty+od, od, oh); // left  (+X)
  setFaceUVs(geo, 1, tx,       ty+od, od, oh); // right (-X)
  setFaceUVs(geo, 2, tx+od,    ty,    ow, od); // top   (+Y)
  setFaceUVs(geo, 3, tx+od+ow, ty,    ow, od); // bottom(-Y)
  setFaceUVs(geo, 4, tx+od,    ty+od, ow, oh); // front (+Z)
  setFaceUVs(geo, 5, tx+od+ow+od, ty+od, ow, oh); // back(-Z)

  const mesh = new THREE.Mesh(geo, mat.clone());
  mesh.castShadow = true;
  return mesh;
}

function buildOuterPart(ow, oh, od, tx, ty, mat, scale=0.125, inflate=1.12) {
  const s = scale * inflate;
  const geo = new THREE.BoxGeometry(ow*s, oh*s, od*s);
  setFaceUVs(geo, 0, tx+od+ow, ty+od, od, oh);
  setFaceUVs(geo, 1, tx,       ty+od, od, oh);
  setFaceUVs(geo, 2, tx+od,    ty,    ow, od);
  setFaceUVs(geo, 3, tx+od+ow, ty,    ow, od);
  setFaceUVs(geo, 4, tx+od,    ty+od, ow, oh);
  setFaceUVs(geo, 5, tx+od+ow+od, ty+od, ow, oh);
  const mesh = new THREE.Mesh(geo, mat.clone());
  mesh.castShadow = true;
  return mesh;
}

/* ── BUILD PLAYER ── */
function buildPlayer(texture) {
  if (playerGroup) { scene.remove(playerGroup); playerGroup = null; parts = {}; }

  texture.magFilter = THREE.NearestFilter;
  texture.minFilter = THREE.NearestFilter;
  texture.colorSpace = THREE.SRGBColorSpace;

  const mat = new THREE.MeshLambertMaterial({ map: texture, transparent: true, alphaTest: 0.05 });
  const S = 0.125; // 1 MC pixel = 0.125 units

  playerGroup = new THREE.Group();

  // ── HEAD: 8×8×8 at (0,0) inner, (32,0) outer
  const head = buildPart(8,8,8, 0,0, mat, S);
  const headOuter = buildOuterPart(8,8,8, 32,0, mat, S, 1.14);
  head.add(headOuter);
  head.position.y = (6+4)*S;   // body_half(6) + neck(0) + head_half(4) = 10
  playerGroup.add(head);
  parts.head = head; parts.headOuter = headOuter;

  // ── BODY: 8×12×4 at (16,16) inner, (16,32) outer
  const body = buildPart(8,12,4, 16,16, mat, S);
  const bodyOuter = buildOuterPart(8,12,4, 16,32, mat, S, 1.12);
  body.add(bodyOuter);
  body.position.y = 0;
  playerGroup.add(body);
  parts.body = body; parts.bodyOuter = bodyOuter;

  const armW = isSlim ? 3 : 4;

  // ── RIGHT ARM: at (40,16) inner, (40,32) outer — player's right = scene -X
  const rArm = buildPart(armW,12,4, 40,16, mat, S);
  const rArmOuter = buildOuterPart(armW,12,4, 40,32, mat, S, 1.12);
  rArm.add(rArmOuter);
  rArm.position.set(-(4*S + armW*S*0.5 + 0.5*S), 0, 0);
  playerGroup.add(rArm);
  parts.rArm = rArm; parts.rArmOuter = rArmOuter;

  // ── LEFT ARM: at (32,48) inner, (48,48) outer — player's left = scene +X
  const lArm = buildPart(armW,12,4, 32,48, mat, S);
  const lArmOuter = buildOuterPart(armW,12,4, 48,48, mat, S, 1.12);
  lArm.add(lArmOuter);
  lArm.position.set(4*S + armW*S*0.5 + 0.5*S, 0, 0);
  playerGroup.add(lArm);
  parts.lArm = lArm; parts.lArmOuter = lArmOuter;

  // ── RIGHT LEG: at (0,16) inner, (0,32) outer
  const rLeg = buildPart(4,12,4, 0,16, mat, S);
  const rLegOuter = buildOuterPart(4,12,4, 0,32, mat, S, 1.12);
  rLeg.add(rLegOuter);
  rLeg.position.set(-2*S, -12*S, 0);
  playerGroup.add(rLeg);
  parts.rLeg = rLeg; parts.rLegOuter = rLegOuter;

  // ── LEFT LEG: at (16,48) inner, (0,48) outer
  const lLeg = buildPart(4,12,4, 16,48, mat, S);
  const lLegOuter = buildOuterPart(4,12,4, 0,48, mat, S, 1.12);
  lLeg.add(lLegOuter);
  lLeg.position.set(2*S, -12*S, 0);
  playerGroup.add(lLeg);
  parts.lLeg = lLeg; parts.lLegOuter = lLegOuter;

  playerGroup.position.y = 0;
  scene.add(playerGroup);

  document.getElementById('empty-state').style.display = 'none';
  skinLoaded = true;
  updateLayerList();
  setStatus('ok', 'SKIN LOADED');
  toast('✓ Skin loaded!');
}

/* ── LOAD SKIN ── */
function loadSkinFromURL(url) {
  setStatus('loading', 'FETCHING...');
  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';
  loader.load(url,
    tex => buildPlayer(tex),
    undefined,
    () => { setStatus('err','LOAD ERR'); toast('Could not load skin'); }
  );
}

window.loadByUsername = function() {
  const name = document.getElementById('username-input').value.trim();
  if (!name) { toast('Enter a username'); return; }
  loadSkinFromURL(`https://mc-heads.net/skin/${encodeURIComponent(name)}`);
}

window.loadPreset = function(name) {
  document.getElementById('username-input').value = name;
  loadSkinFromURL(`https://mc-heads.net/skin/${name}`);
}

document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  setStatus('loading','LOADING...');
  const url = URL.createObjectURL(f);
  loadSkinFromURL(url);
});

document.getElementById('cape-input').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const loader = new THREE.TextureLoader();
  loader.load(URL.createObjectURL(f), tex => {
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    addCape(tex);
  });
});

function addCape(tex) {
  if (!playerGroup) return;
  if (capeMesh) playerGroup.remove(capeMesh);
  const S = 0.125;
  const geo = new THREE.BoxGeometry(10*S, 16*S, 1*S);
  capeMesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: tex, transparent: true, alphaTest: 0.05 }));
  capeMesh.position.set(0, 2*S, -3*S);
  capeMesh.rotation.x = 0.1;
  capeMesh.visible = showCape;
  playerGroup.add(capeMesh);
  toast('Cape loaded!');
}

// Drag & drop
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.type === 'image/png') { setStatus('loading','LOADING...'); loadSkinFromURL(URL.createObjectURL(f)); }
});

/* ── ANIMATIONS ── */
window.setAnim = function(name) {
  currentAnim = name; animTime = 0;
  document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
  const b = document.getElementById('anim-' + name);
  if (b) b.classList.add('active');
  document.getElementById('anim-val').textContent = name.toUpperCase();
  // reset rotations
  if (playerGroup) {
    [parts.head, parts.body, parts.rArm, parts.lArm, parts.rLeg, parts.lLeg].forEach(m => {
      if (m) { m.rotation.set(0,0,0); }
    });
  }
}

function doAnimation(dt) {
  if (!skinLoaded || !playerGroup) return;
  const t = animTime;
  const sp = animSpeed;

  const p = parts;
  if (currentAnim === 'idle') {
    playerGroup.position.y = Math.sin(t * 1.2 * sp) * 0.015;
    if (p.head) p.head.rotation.y = Math.sin(t * 0.4 * sp) * 0.09;
    if (p.lArm) p.lArm.rotation.z = Math.sin(t * 0.6 * sp) * 0.04;
    if (p.rArm) p.rArm.rotation.z = -Math.sin(t * 0.6 * sp) * 0.04;
  } else if (currentAnim === 'walk') {
    const sw = Math.sin(t * 3 * sp) * 0.6;
    if (p.lArm) p.lArm.rotation.x = -sw;
    if (p.rArm) p.rArm.rotation.x = sw;
    if (p.lLeg) p.lLeg.rotation.x = sw;
    if (p.rLeg) p.rLeg.rotation.x = -sw;
    if (p.body) p.body.rotation.y = Math.sin(t * 3 * sp) * 0.05;
    playerGroup.position.y = Math.abs(Math.sin(t * 3 * sp)) * 0.04;
  } else if (currentAnim === 'run') {
    const sw = Math.sin(t * 5 * sp) * 0.9;
    if (p.lArm) p.lArm.rotation.x = -sw * 0.8;
    if (p.rArm) p.rArm.rotation.x = sw * 0.8;
    if (p.lLeg) p.lLeg.rotation.x = sw;
    if (p.rLeg) p.rLeg.rotation.x = -sw;
    if (p.body) p.body.rotation.x = -0.2;
    if (p.head) p.head.rotation.x = 0.12;
    playerGroup.position.y = Math.abs(Math.sin(t * 5 * sp)) * 0.08;
  } else if (currentAnim === 'wave') {
    if (p.rArm) { p.rArm.rotation.z = -0.8 - Math.sin(t * 4 * sp) * 0.35; p.rArm.rotation.x = -0.5; }
    if (p.head) p.head.rotation.y = Math.sin(t * 1.5 * sp) * 0.15;
    playerGroup.position.y = Math.sin(t * sp) * 0.01;
  } else if (currentAnim === 'fly') {
    if (p.lArm) p.lArm.rotation.z = Math.PI/2 + Math.sin(t*2*sp)*0.15;
    if (p.rArm) p.rArm.rotation.z = -(Math.PI/2 + Math.sin(t*2*sp)*0.15);
    if (p.lLeg) p.lLeg.rotation.x = 0.3;
    if (p.rLeg) p.rLeg.rotation.x = 0.3;
    if (p.body) p.body.rotation.x = -0.25;
    playerGroup.position.y = Math.sin(t * 0.8 * sp) * 0.12;
  } else {
    playerGroup.position.y = 0;
  }
}

/* ── MAIN LOOP ── */
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  animTime += dt;

  // FPS
  fpsFrames++;
  if (now - fpsLast >= 1000) {
    fpsVal = fpsFrames; fpsFrames = 0; fpsLast = now;
    document.getElementById('fps-val').textContent = fpsVal;
  }

  // auto rotate
  if (autoRotate && playerGroup) {
    playerGroup.rotation.y += dt * 0.4;
    document.getElementById('rot-val').textContent = ((playerGroup.rotation.y * 180/Math.PI) % 360 | 0) + '°';
  }

  doAnimation(dt);
  controls.update();
  renderer.render(scene, camera);
}

/* ── UI CONTROLS ── */
window.toggleOpt = function(opt) {
  const el = document.getElementById('toggle-' + opt);
  const on = !el.classList.contains('on');
  el.classList.toggle('on', on);
  if (opt === 'rotate') autoRotate = on;
  else if (opt === 'cape') { showCape = on; if (capeMesh) capeMesh.visible = on; }
  else if (opt === 'slim') { isSlim = on; toast('Slim: reload skin to apply'); }
}

window.updateLight = function(type, val) {
  if (type === 'ambient') {
    const v = val/100;
    document.getElementById('val-ambient').textContent = v.toFixed(1);
    if (ambientLight) ambientLight.intensity = v;
  } else {
    const v = val/100;
    document.getElementById('val-point').textContent = v.toFixed(1);
    if (pointLight) pointLight.intensity = v;
  }
}

window.setLightColor = function(hex, name) {
  if (pointLight) pointLight.color.setStyle(hex);
  toast('Light: ' + name);
}

window.updateCamera = function(type, val) {
  if (type === 'zoom') {
    document.getElementById('val-zoom').textContent = val;
    camera.fov = parseInt(val); camera.updateProjectionMatrix();
  } else {
    animSpeed = val/100;
    document.getElementById('val-speed').textContent = animSpeed.toFixed(1)+'x';
  }
}

window.explodeLayers = function(val) {
  const v = val/100;
  document.getElementById('val-explode').textContent = val;
  if (!skinLoaded) return;
  const dirs = [
    { outer: parts.headOuter,  d: new THREE.Vector3(0,1,0) },
    { outer: parts.bodyOuter,  d: new THREE.Vector3(0,0,1) },
    { outer: parts.rArmOuter,  d: new THREE.Vector3(-1,0,0) },
    { outer: parts.lArmOuter,  d: new THREE.Vector3(1,0,0) },
    { outer: parts.rLegOuter,  d: new THREE.Vector3(-0.5,-0.5,0) },
    { outer: parts.lLegOuter,  d: new THREE.Vector3(0.5,-0.5,0) },
  ];
  dirs.forEach(({ outer, d }) => {
    if (outer) outer.position.copy(d).multiplyScalar(v * 0.5);
  });
  document.querySelectorAll('.layer-offset').forEach(el => el.textContent = (v*0.5).toFixed(2));
}

function updateLayerList() {
  const list = document.getElementById('layer-list');
  const items = [
    { name:'HEAD outer',     color:'#FF6A00' },
    { name:'BODY outer',     color:'#ff9944' },
    { name:'R.ARM outer',    color:'#ffbb66' },
    { name:'L.ARM outer',    color:'#ffcc88' },
    { name:'R.LEG outer',    color:'#ff8833' },
    { name:'L.LEG outer',    color:'#ff7722' },
  ];
  list.innerHTML = items.map(i => `
    <div class="layer-item">
      <span class="layer-dot" style="border-color:${i.color};background:${i.color}33"></span>
      <span class="layer-name">${i.name}</span>
      <span class="layer-offset">0.00</span>
    </div>`).join('');
}

window.setMode = function(mode) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+mode).classList.add('active');
  if (mode === 'layers') document.getElementById('layer-section').scrollIntoView({ behavior:'smooth' });
  else if (mode === 'debug') {
    toast('WebGL2: ' + renderer.capabilities.isWebGL2);
    setTimeout(() => toast('MaxTex: ' + renderer.capabilities.maxTextureSize), 1400);
  }
}

window.exportPNG = function() {
  if (!skinLoaded) { toast('Load a skin first'); return; }
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = 'skin3d.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
  toast('PNG saved!');
}

function setStatus(state, text) {
  document.getElementById('status-dot').className = 'status-dot ' + state;
  document.getElementById('status-text').textContent = text;
}

let toastTimer;
window.toast = function(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

document.getElementById('username-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadByUsername();
});

init();
</script>
</body>
</html>

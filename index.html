<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skin3D Viewer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap');

    :root {
      --orange:    #FF6A00;
      --orange-dim:#C24D00;
      --orange-glow: #FF6A0055;
      --bg:        #0D0D0D;
      --bg2:       #141414;
      --bg3:       #1C1C1C;
      --panel:     #191919;
      --border:    #2A2A2A;
      --text:      #E0E0E0;
      --text-dim:  #888;
      --pixel: 2px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'VT323', monospace;
      font-size: 20px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── SCANLINE OVERLAY ─── */
    body::after {
      content: '';
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.08) 3px,
        rgba(0,0,0,0.08) 4px
      );
      z-index: 9999;
    }

    /* ─── PIXEL BORDER UTIL ─── */
    .px-box {
      border: var(--pixel) solid var(--border);
      image-rendering: pixelated;
      position: relative;
    }
    .px-box::before {
      content: '';
      position: absolute;
      inset: -4px;
      border: var(--pixel) solid #111;
      pointer-events: none;
    }

    /* ─── HEADER ─── */
    header {
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: var(--pixel) solid var(--border);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--orange);
      text-shadow: 3px 3px 0 var(--orange-dim), 0 0 18px var(--orange-glow);
      letter-spacing: 1px;
      line-height: 1.6;
    }
    .logo span { color: #fff; }
    header nav {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      font-family: 'VT323', monospace;
      font-size: 18px;
      background: none;
      border: var(--pixel) solid var(--border);
      color: var(--text-dim);
      padding: 5px 14px;
      cursor: pointer;
      transition: color .1s, border-color .1s, background .1s;
      text-transform: uppercase;
    }
    .nav-btn:hover, .nav-btn.active {
      color: var(--orange);
      border-color: var(--orange);
      background: #FF6A0012;
    }

    /* ─── MAIN LAYOUT ─── */
    main {
      display: grid;
      grid-template-columns: 300px 1fr 260px;
      gap: 0;
      height: calc(100vh - 61px);
    }

    /* ─── PANELS ─── */
    .left-panel, .right-panel {
      background: var(--panel);
      border-right: var(--pixel) solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .right-panel { border-right: none; border-left: var(--pixel) solid var(--border); }

    .section {
      border-bottom: var(--pixel) solid var(--border);
      padding: 16px;
    }
    .section-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: var(--pixel);
      background: var(--border);
    }

    /* ─── INPUTS ─── */
    .px-input {
      width: 100%;
      background: var(--bg3);
      border: var(--pixel) solid var(--border);
      color: var(--text);
      font-family: 'VT323', monospace;
      font-size: 20px;
      padding: 8px 12px;
      outline: none;
      transition: border-color .1s;
    }
    .px-input:focus { border-color: var(--orange); }
    .px-input::placeholder { color: var(--text-dim); }

    .px-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      background: var(--orange);
      color: #000;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background .1s, transform .05s;
      position: relative;
      box-shadow: 3px 3px 0 var(--orange-dim);
    }
    .px-btn:hover { background: #ff8c33; }
    .px-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--orange-dim); }
    .px-btn.secondary {
      background: var(--bg3);
      color: var(--orange);
      border: var(--pixel) solid var(--orange);
      box-shadow: 3px 3px 0 var(--orange-dim);
    }
    .px-btn.secondary:hover { background: #FF6A0018; }

    .input-row { display: flex; gap: 6px; }
    .input-row .px-input { flex: 1; }
    .input-row .px-btn { width: auto; margin-top: 0; padding: 8px 12px; white-space: nowrap; }

    /* ─── FILE UPLOAD ─── */
    .upload-zone {
      border: var(--pixel) dashed var(--border);
      background: var(--bg3);
      padding: 22px 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      font-size: 17px;
      color: var(--text-dim);
      line-height: 1.6;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--orange);
      background: #FF6A000A;
      color: var(--text);
    }
    .upload-zone .icon { font-size: 28px; display: block; margin-bottom: 6px; }
    #file-input { display: none; }

    /* ─── SLIDER ─── */
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 17px;
    }
    .slider-row label { color: var(--text-dim); }
    .slider-row .val { color: var(--orange); font-family: 'VT323', monospace; min-width: 38px; text-align: right; }
    input[type=range] {
      width: 100%;
      accent-color: var(--orange);
      cursor: pointer;
      margin-top: 2px;
    }

    /* ─── TOGGLE ─── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 18px;
      color: var(--text-dim);
    }
    .toggle {
      width: 36px; height: 18px;
      background: var(--bg3);
      border: var(--pixel) solid var(--border);
      position: relative;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .toggle.on { background: var(--orange); border-color: var(--orange-dim); }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 10px; height: 10px;
      background: #fff;
      transition: left .15s;
    }
    .toggle.on::after { left: 22px; }

    /* ─── ANIMATION BUTTONS ─── */
    .anim-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .anim-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      background: var(--bg3);
      border: var(--pixel) solid var(--border);
      color: var(--text-dim);
      padding: 9px 4px;
      cursor: pointer;
      text-align: center;
      transition: all .1s;
      line-height: 1.8;
    }
    .anim-btn:hover { border-color: var(--orange); color: var(--orange); }
    .anim-btn.active { background: #FF6A0018; border-color: var(--orange); color: var(--orange); }

    /* ─── LAYER EXPLORER ─── */
    .layer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #222;
      font-size: 17px;
    }
    .layer-dot {
      width: 10px; height: 10px;
      border: var(--pixel) solid;
      flex-shrink: 0;
    }
    .layer-name { flex: 1; color: var(--text-dim); }
    .layer-offset { color: var(--orange); font-size: 15px; width: 40px; text-align: right; }

    /* ─── CENTER: CANVAS ─── */
    .center-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* pixel grid bg */
    .center-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: .18;
      pointer-events: none;
    }

    #viewer-container {
      position: relative;
      width: 420px;
      height: 560px;
    }
    #skin-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ─── EMPTY STATE ─── */
    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
    }
    .empty-pixel {
      width: 64px; height: 64px;
      background:
        linear-gradient(45deg, var(--border) 25%, transparent 25%) 0 0,
        linear-gradient(-45deg, var(--border) 25%, transparent 25%) 8px 0,
        linear-gradient(45deg, transparent 75%, var(--border) 75%) 8px -8px,
        linear-gradient(-45deg, transparent 75%, var(--border) 75%) 0px 8px;
      background-size: 16px 16px;
      background-color: var(--bg3);
      opacity: .5;
      image-rendering: pixelated;
    }
    #empty-state p {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: var(--text-dim);
      text-align: center;
      line-height: 2;
    }

    /* ─── BOTTOM BAR ─── */
    .bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: #0D0D0Dcc;
      border-top: var(--pixel) solid var(--border);
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 16px;
      color: var(--text-dim);
      backdrop-filter: blur(4px);
    }
    .stat { display: flex; align-items: center; gap: 5px; }
    .stat-val { color: var(--orange); }

    /* ─── TOAST ─── */
    #toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--panel);
      border: var(--pixel) solid var(--orange);
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      padding: 12px 20px;
      z-index: 9998;
      transition: transform .25s;
      pointer-events: none;
      box-shadow: 4px 4px 0 var(--orange-dim);
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── MODE TABS ─── */
    .mode-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 0;
    }
    .mode-tab {
      flex: 1;
      font-family: 'Press Start 2P', monospace;
      font-size: 6px;
      background: var(--bg3);
      border: var(--pixel) solid var(--border);
      border-bottom: none;
      color: var(--text-dim);
      padding: 9px 4px;
      cursor: pointer;
      text-align: center;
      transition: all .1s;
    }
    .mode-tab.active { background: var(--panel); color: var(--orange); border-color: var(--orange); }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border); }
    ::-webkit-scrollbar-thumb:hover { background: var(--orange-dim); }

    /* ─── STATUS INDICATOR ─── */
    .status-dot {
      width: 8px; height: 8px;
      background: var(--border);
      display: inline-block;
      margin-right: 6px;
      animation: blink 1s step-end infinite;
    }
    .status-dot.loading { background: var(--orange); }
    .status-dot.ok { background: #4CAF50; animation: none; }
    .status-dot.err { background: #f44; animation: none; }
    @keyframes blink { 50% { opacity: 0; } }

    .color-swatch {
      display: inline-block;
      width: 14px; height: 14px;
      border: var(--pixel) solid var(--border);
      vertical-align: middle;
      margin-right: 4px;
      cursor: pointer;
      image-rendering: pixelated;
    }

    /* responsive */
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 340px auto; }
      .left-panel, .right-panel { max-height: 220px; }
      #viewer-container { width: 280px; height: 360px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">SKIN<span>3D</span><br>VIEWER</div>
  <nav>
    <button class="nav-btn active" onclick="setMode('viewer')">VIEWER</button>
    <button class="nav-btn" onclick="setMode('layers')">LAYERS</button>
    <button class="nav-btn" onclick="setMode('debug')">DEBUG</button>
  </nav>
</header>

<main>

  <!-- ─── LEFT PANEL ─── -->
  <aside class="left-panel">

    <!-- Username -->
    <div class="section">
      <div class="section-title">Username</div>
      <div class="input-row">
        <input class="px-input" id="username-input" type="text" placeholder="Notch" />
        <button class="px-btn" style="width:auto;margin-top:0;padding:8px 10px;font-size:7px" onclick="loadByUsername()">▶</button>
      </div>
    </div>

    <!-- File upload -->
    <div class="section">
      <div class="section-title">Upload Skin</div>
      <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <span class="icon">⬆</span>
        Drop .png here<br>or click to browse
      </div>
      <input type="file" id="file-input" accept=".png,image/png" />
    </div>

    <!-- Cape -->
    <div class="section">
      <div class="section-title">Cape</div>
      <div class="upload-zone" style="padding:14px 10px;font-size:16px" id="cape-zone" onclick="document.getElementById('cape-input').click()">
        <span class="icon" style="font-size:20px">🧣</span>
        Upload cape .png
      </div>
      <input type="file" id="cape-input" accept=".png,image/png" />
    </div>

    <!-- Presets -->
    <div class="section">
      <div class="section-title">Quick Load</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="px-btn secondary" onclick="loadPreset('Notch')">NOTCH</button>
        <button class="px-btn secondary" onclick="loadPreset('jeb_')">JEB_</button>
        <button class="px-btn secondary" onclick="loadPreset('Dream')">DREAM</button>
        <button class="px-btn secondary" onclick="loadPreset('Technoblade')">TECHNOBLADE</button>
      </div>
    </div>

  </aside>

  <!-- ─── CENTER ─── -->
  <section class="center-area">
    <div id="viewer-container" class="px-box">
      <canvas id="skin-canvas"></canvas>
      <div id="empty-state">
        <div class="empty-pixel"></div>
        <p>NO SKIN LOADED<br>SEARCH OR UPLOAD<br>TO BEGIN</p>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="stat">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">READY</span>
      </div>
      <div class="stat" style="margin-left:auto">FPS <span class="stat-val" id="fps-val">--</span></div>
      <div class="stat">ROT <span class="stat-val" id="rot-val">0°</span></div>
      <div class="stat">ANIM <span class="stat-val" id="anim-val">NONE</span></div>
    </div>
  </section>

  <!-- ─── RIGHT PANEL ─── -->
  <aside class="right-panel">

    <!-- Animations -->
    <div class="section">
      <div class="section-title">Animation</div>
      <div class="anim-grid">
        <button class="anim-btn active" onclick="setAnim('idle')" id="anim-idle">IDLE</button>
        <button class="anim-btn" onclick="setAnim('walk')" id="anim-walk">WALK</button>
        <button class="anim-btn" onclick="setAnim('run')" id="anim-run">RUN</button>
        <button class="anim-btn" onclick="setAnim('wave')" id="anim-wave">WAVE</button>
        <button class="anim-btn" onclick="setAnim('fly')" id="anim-fly">FLY</button>
        <button class="anim-btn" onclick="setAnim('none')" id="anim-none">STOP</button>
      </div>
    </div>

    <!-- Controls -->
    <div class="section">
      <div class="section-title">Controls</div>
      <div class="toggle-row">
        <span>Auto rotate</span>
        <div class="toggle on" id="toggle-rotate" onclick="toggleOpt('rotate')"></div>
      </div>
      <div class="toggle-row">
        <span>Show cape</span>
        <div class="toggle on" id="toggle-cape" onclick="toggleOpt('cape')"></div>
      </div>
      <div class="toggle-row">
        <span>Slim model</span>
        <div class="toggle" id="toggle-slim" onclick="toggleOpt('slim')"></div>
      </div>
    </div>

    <!-- Lighting -->
    <div class="section">
      <div class="section-title">Lighting</div>
      <div class="slider-row">
        <label>Ambient</label>
        <span class="val" id="val-ambient">0.6</span>
      </div>
      <input type="range" min="0" max="100" value="60" id="sl-ambient" oninput="updateLight('ambient',this.value)">

      <div class="slider-row" style="margin-top:10px">
        <label>Point Light</label>
        <span class="val" id="val-point">1.0</span>
      </div>
      <input type="range" min="0" max="200" value="100" id="sl-point" oninput="updateLight('point',this.value)">

      <div class="slider-row" style="margin-top:10px">
        <label>Light Color</label>
        <span>
          <span class="color-swatch" id="lc-white" style="background:#fff;border-color:#555" onclick="setLightColor('#ffffff','white')"></span>
          <span class="color-swatch" id="lc-orange" style="background:#FF6A00" onclick="setLightColor('#ff6a00','orange')"></span>
          <span class="color-swatch" id="lc-blue" style="background:#4499ff" onclick="setLightColor('#4499ff','blue')"></span>
          <span class="color-swatch" id="lc-green" style="background:#44ff88" onclick="setLightColor('#44ff88','green')"></span>
        </span>
      </div>
    </div>

    <!-- Camera -->
    <div class="section">
      <div class="section-title">Camera</div>
      <div class="slider-row">
        <label>Zoom</label>
        <span class="val" id="val-zoom">40</span>
      </div>
      <input type="range" min="15" max="90" value="40" id="sl-zoom" oninput="updateCamera('zoom',this.value)">

      <div class="slider-row" style="margin-top:10px">
        <label>Anim Speed</label>
        <span class="val" id="val-speed">1.0x</span>
      </div>
      <input type="range" min="10" max="300" value="100" id="sl-speed" oninput="updateCamera('speed',this.value)">
    </div>

    <!-- Layers (3D skin slayer) -->
    <div class="section" id="layer-section">
      <div class="section-title">3D Layers</div>
      <div id="layer-list">
        <div style="color:var(--text-dim);font-size:16px">Load a skin first</div>
      </div>
      <div class="slider-row" style="margin-top:12px">
        <label>Explode</label>
        <span class="val" id="val-explode">0</span>
      </div>
      <input type="range" min="0" max="100" value="0" id="sl-explode" oninput="explodeLayers(this.value)">
    </div>

    <!-- Export -->
    <div class="section">
      <div class="section-title">Export</div>
      <button class="px-btn secondary" onclick="exportPNG()">SAVE PNG</button>
    </div>

  </aside>
</main>

<div id="toast"></div>

<!-- skin3d via CDN -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

/* ─── STATE ─── */
let scene, camera, renderer, controls, animId;
let playerGroup, headMesh, bodyMesh, leftArmMesh, rightArmMesh, leftLegMesh, rightLegMesh;
let capeMesh;
let outerMeshes = {};   // for 3D layer explode
let currentAnim = 'idle';
let animTime = 0;
let skinLoaded = false;
let autoRotate = true;
let showCape = true;
let pointLight;
let fpsCounter = { frames: 0, last: performance.now(), val: 0 };

/* ─── INIT THREE.JS ─── */
function init() {
  const canvas = document.getElementById('skin-canvas');
  const W = canvas.parentElement.clientWidth;
  const H = canvas.parentElement.clientHeight;

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.background = null; // transparent — CSS handles bg

  camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 1000);
  camera.position.set(0, 1.5, 6);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 2;
  controls.maxDistance = 14;
  controls.target.set(0, 0.5, 0);
  controls.update();

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  ambientLight.name = 'ambient';
  scene.add(ambientLight);

  pointLight = new THREE.PointLight(0xffffff, 1.0, 50);
  pointLight.position.set(3, 5, 4);
  pointLight.castShadow = true;
  scene.add(pointLight);

  const fillLight = new THREE.DirectionalLight(0xff6a00, 0.18);
  fillLight.position.set(-3, -1, -2);
  scene.add(fillLight);

  // Shadow plane
  const planeGeo = new THREE.PlaneGeometry(10, 10);
  const planeMat = new THREE.ShadowMaterial({ opacity: 0.18 });
  const plane = new THREE.Mesh(planeGeo, planeMat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -2.8;
  plane.receiveShadow = true;
  scene.add(plane);

  window.addEventListener('resize', () => {
    const W2 = canvas.parentElement.clientWidth;
    const H2 = canvas.parentElement.clientHeight;
    renderer.setSize(W2, H2);
    camera.aspect = W2 / H2;
    camera.updateProjectionMatrix();
  });

  animate();
}

/* ─── MINECRAFT PLAYER GEOMETRY ─── */
/* Dimensions: 1 unit = 1 pixel block */
const S = 1/16; // scale

function uvMap(u, v, w, h, texW=64, texH=64) {
  return [u/texW, 1-(v+h)/texH, (u+w)/texW, 1-v/texH];
}

function buildFace(geo, uvs, faceIndex, [u0,v0,u1,v1]) {
  // set UV for the face (2 triangles = 6 uv pairs)
  const uvAttr = geo.attributes.uv;
  // BoxGeometry face order: +x,-x,+y,-y,+z,-z (right,left,top,bottom,front,back)
  const fi = faceIndex * 6;
  const corners = [
    [u0,v1],[u1,v1],[u0,v0],
    [u1,v1],[u1,v0],[u0,v0]
  ];
  for (let i = 0; i < 6; i++) {
    uvAttr.setXY(fi + i, corners[i][0], corners[i][1]);
  }
  uvAttr.needsUpdate = true;
}

function makePart(wBlocks, hBlocks, dBlocks, tx, ty, skinTex, outerTx, outerTy) {
  const scale = 0.125;
  const w = wBlocks * scale, h = hBlocks * scale, d = dBlocks * scale;

  const geo = new THREE.BoxGeometry(w, h, d);

  // UV mapping: Minecraft atlas layout
  // Each face: right(+x), left(-x), top(+y), bottom(-y), front(+z), back(-z)
  const T = 64; // texture size
  const [ow, oh, od] = [wBlocks, hBlocks, dBlocks];

  // Helper: face index per three.js BoxGeometry
  // 0=+x(right), 1=-x(left), 2=+y(top), 3=-y(bottom), 4=+z(front), 5=-z(back)
  function setFaceUV(geom, fi, u, v, fw, fh) {
    const uvA = geom.attributes.uv;
    const base = fi * 6;
    const u0=u/T, v0=1-(v+fh)/T, u1=(u+fw)/T, v1=1-v/T;
    const pts = [[u0,v1],[u1,v1],[u0,v0],[u1,v1],[u1,v0],[u0,v0]];
    for (let i=0;i<6;i++) uvA.setXY(base+i, pts[i][0], pts[i][1]);
    uvA.needsUpdate = true;
  }

  // Standard Minecraft face layout for a part at (tx,ty):
  // top: (tx+od, ty, ow, od)  bottom: (tx+od+ow, ty, ow, od)
  // left: (tx, ty+od, od, oh)  front: (tx+od, ty+od, ow, oh)
  // right: (tx+od+ow, ty+od, od, oh)  back: (tx+od+ow+od, ty+od, ow, oh)
  setFaceUV(geo, 0, tx+od+ow, ty+od, od, oh);   // right (+x)
  setFaceUV(geo, 1, tx,       ty+od, od, oh);   // left  (-x)
  setFaceUV(geo, 2, tx+od,    ty,    ow, od);   // top   (+y)
  setFaceUV(geo, 3, tx+od+ow, ty,    ow, od);   // bottom(-y)
  setFaceUV(geo, 4, tx+od,    ty+od, ow, oh);   // front (+z)
  setFaceUV(geo, 5, tx+od+ow+od, ty+od, ow, oh);// back  (-z)

  const mat = new THREE.MeshLambertMaterial({ map: skinTex, transparent: true, alphaTest: 0.1 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;

  if (outerTx !== undefined && outerTy !== undefined) {
    const oGeo = new THREE.BoxGeometry(w*1.12, h*1.12, d*1.12);
    setFaceUV(oGeo, 0, outerTx+od+ow, outerTy+od, od, oh);
    setFaceUV(oGeo, 1, outerTx,       outerTy+od, od, oh);
    setFaceUV(oGeo, 2, outerTx+od,    outerTy,    ow, od);
    setFaceUV(oGeo, 3, outerTx+od+ow, outerTy,    ow, od);
    setFaceUV(oGeo, 4, outerTx+od,    outerTy+od, ow, oh);
    setFaceUV(oGeo, 5, outerTx+od+ow+od, outerTy+od, ow, oh);
    const oMat = new THREE.MeshLambertMaterial({ map: skinTex, transparent: true, alphaTest: 0.05, side: THREE.FrontSide });
    const oMesh = new THREE.Mesh(oGeo, oMat);
    mesh.add(oMesh);
    return { mesh, outer: oMesh };
  }

  return { mesh, outer: null };
}

function buildPlayer(texture) {
  if (playerGroup) { scene.remove(playerGroup); }
  playerGroup = new THREE.Group();

  const S = 0.125;

  // HEAD (8x8x8 at 0,0)
  const { mesh: head, outer: headOuter } = makePart(8,8,8, 0,0, texture, 32,0);
  head.position.y = 4*S*2 + 4*S;
  playerGroup.add(head); headMesh = head;
  if (headOuter) outerMeshes.head = headOuter;

  // BODY (8x12x4 at 16,16)
  const { mesh: body } = makePart(8,12,4, 16,16, texture, 16,32);
  body.position.y = 0;
  playerGroup.add(body); bodyMesh = body;

  // RIGHT ARM (slim=3, normal=4 wide; 12 tall; 4 deep at 40,16)
  const { mesh: rArm, outer: rArmOuter } = makePart(4,12,4, 40,16, texture, 40,32);
  rArm.position.set(-(4*S + 2*S), 0, 0);
  playerGroup.add(rArm); rightArmMesh = rArm;
  if (rArmOuter) outerMeshes.rightArm = rArmOuter;

  // LEFT ARM (48,16)
  const { mesh: lArm, outer: lArmOuter } = makePart(4,12,4, 32,48, texture, 48,48);
  lArm.position.set(4*S + 2*S, 0, 0);
  playerGroup.add(lArm); leftArmMesh = lArm;
  if (lArmOuter) outerMeshes.leftArm = lArmOuter;

  // RIGHT LEG (0,16)
  const { mesh: rLeg, outer: rLegOuter } = makePart(4,12,4, 0,16, texture, 0,32);
  rLeg.position.set(-2*S, -12*S, 0);
  playerGroup.add(rLeg); rightLegMesh = rLeg;
  if (rLegOuter) outerMeshes.rightLeg = rLegOuter;

  // LEFT LEG (16,48)
  const { mesh: lLeg, outer: lLegOuter } = makePart(4,12,4, 16,48, texture, 0,48);
  lLeg.position.set(2*S, -12*S, 0);
  playerGroup.add(lLeg); leftLegMesh = lLeg;
  if (lLegOuter) outerMeshes.leftLeg = lLegOuter;

  playerGroup.position.y = -0.4;
  scene.add(playerGroup);

  document.getElementById('empty-state').style.display = 'none';
  skinLoaded = true;
  updateLayerList();
  setStatus('ok', 'SKIN LOADED');
  toast('Skin loaded!');
}

/* ─── LOAD BY USERNAME ─── */
window.loadByUsername = async function() {
  const name = document.getElementById('username-input').value.trim();
  if (!name) return toast('Enter a username');
  setStatus('loading', 'FETCHING...');
  try {
    // Use mc-heads as proxy (CORS friendly)
    const url = `https://mc-heads.net/skin/${name}`;
    loadSkinFromURL(url, name);
  } catch(e) {
    setStatus('err', 'NOT FOUND');
    toast('Player not found');
  }
}

window.loadPreset = function(name) {
  document.getElementById('username-input').value = name;
  setStatus('loading', 'FETCHING...');
  loadSkinFromURL(`https://mc-heads.net/skin/${name}`, name);
}

function loadSkinFromURL(url, name='skin') {
  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';
  loader.load(
    url,
    (tex) => {
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      buildPlayer(tex);
      document.getElementById('rot-val').textContent = '0°';
    },
    undefined,
    (err) => {
      setStatus('err', 'LOAD ERR');
      toast('Could not load skin');
    }
  );
}

/* ─── FILE UPLOAD ─── */
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  loadSkinFromFile(file);
});

document.getElementById('cape-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  loadCapeFromFile(file);
});

function loadSkinFromFile(file) {
  const url = URL.createObjectURL(file);
  setStatus('loading', 'LOADING...');
  loadSkinFromURL(url, file.name);
}

function loadCapeFromFile(file) {
  const url = URL.createObjectURL(file);
  const loader = new THREE.TextureLoader();
  loader.load(url, tex => {
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    addCape(tex);
    toast('Cape loaded!');
  });
}

function addCape(tex) {
  if (capeMesh) playerGroup.remove(capeMesh);
  const S = 0.125;
  const geo = new THREE.BoxGeometry(10*S, 16*S, 1*S);
  // simple cape UV
  const mat = new THREE.MeshLambertMaterial({ map: tex, transparent: true, alphaTest: 0.1 });
  capeMesh = new THREE.Mesh(geo, mat);
  capeMesh.position.set(0, 1*S, -3*S);
  capeMesh.rotation.x = 0.15;
  playerGroup.add(capeMesh);
  capeMesh.visible = showCape;
}

/* ─── DRAG & DROP ─── */
const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'image/png') loadSkinFromFile(file);
});

/* ─── ANIMATIONS ─── */
window.setAnim = function(name) {
  currentAnim = name;
  animTime = 0;
  document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('anim-' + name);
  if (btn) btn.classList.add('active');
  document.getElementById('anim-val').textContent = name.toUpperCase();
}

let animSpeed = 1.0;

function doAnimation(delta) {
  if (!skinLoaded) return;
  const t = animTime;
  const sp = animSpeed;

  // reset
  [headMesh, bodyMesh, leftArmMesh, rightArmMesh, leftLegMesh, rightLegMesh].forEach(m => {
    if (m) { m.rotation.x = 0; m.rotation.y = 0; m.rotation.z = 0; }
  });

  if (currentAnim === 'idle') {
    const bob = Math.sin(t * 1.2 * sp) * 0.012;
    playerGroup.position.y = -0.4 + bob;
    if (headMesh) headMesh.rotation.y = Math.sin(t * 0.4 * sp) * 0.08;
    if (leftArmMesh) leftArmMesh.rotation.z = Math.sin(t * 0.6 * sp) * 0.04;
    if (rightArmMesh) rightArmMesh.rotation.z = -Math.sin(t * 0.6 * sp) * 0.04;

  } else if (currentAnim === 'walk') {
    const sw = Math.sin(t * 3 * sp) * 0.6;
    if (leftArmMesh) leftArmMesh.rotation.x = -sw;
    if (rightArmMesh) rightArmMesh.rotation.x = sw;
    if (leftLegMesh) leftLegMesh.rotation.x = sw;
    if (rightLegMesh) rightLegMesh.rotation.x = -sw;
    if (bodyMesh) bodyMesh.rotation.y = Math.sin(t * 3 * sp) * 0.05;
    playerGroup.position.y = -0.4 + Math.abs(Math.sin(t * 3 * sp)) * 0.04;

  } else if (currentAnim === 'run') {
    const sw = Math.sin(t * 5 * sp) * 0.9;
    if (leftArmMesh) leftArmMesh.rotation.x = -sw * 0.8;
    if (rightArmMesh) rightArmMesh.rotation.x = sw * 0.8;
    if (leftLegMesh) leftLegMesh.rotation.x = sw;
    if (rightLegMesh) rightLegMesh.rotation.x = -sw;
    if (bodyMesh) bodyMesh.rotation.x = -0.18;
    if (headMesh) headMesh.rotation.x = 0.1;
    playerGroup.position.y = -0.4 + Math.abs(Math.sin(t * 5 * sp)) * 0.08;

  } else if (currentAnim === 'wave') {
    if (rightArmMesh) {
      rightArmMesh.rotation.z = -0.8 - Math.sin(t * 4 * sp) * 0.35;
      rightArmMesh.rotation.x = -0.5;
    }
    if (headMesh) headMesh.rotation.y = Math.sin(t * 1.5 * sp) * 0.15;
    playerGroup.position.y = -0.4 + Math.sin(t * 1 * sp) * 0.01;

  } else if (currentAnim === 'fly') {
    if (leftArmMesh) leftArmMesh.rotation.z = Math.PI/2 + Math.sin(t * 2 * sp) * 0.15;
    if (rightArmMesh) rightArmMesh.rotation.z = -(Math.PI/2 + Math.sin(t * 2 * sp) * 0.15);
    if (leftLegMesh) leftLegMesh.rotation.x = 0.3;
    if (rightLegMesh) rightLegMesh.rotation.x = 0.3;
    if (bodyMesh) bodyMesh.rotation.x = -0.25;
    playerGroup.position.y = -0.4 + Math.sin(t * 0.8 * sp) * 0.12;
  }
}

/* ─── MAIN LOOP ─── */
function animate() {
  animId = requestAnimationFrame(animate);

  const now = performance.now();
  const delta = Math.min((now - (animate._last || now)) / 1000, 0.05);
  animate._last = now;

  animTime += delta;

  // FPS
  fpsCounter.frames++;
  if (now - fpsCounter.last >= 1000) {
    fpsCounter.val = fpsCounter.frames;
    fpsCounter.frames = 0;
    fpsCounter.last = now;
    document.getElementById('fps-val').textContent = fpsCounter.val;
  }

  // Auto rotate
  if (autoRotate && playerGroup) {
    playerGroup.rotation.y += delta * 0.4;
    document.getElementById('rot-val').textContent = (playerGroup.rotation.y * 180/Math.PI % 360 | 0) + '°';
  }

  doAnimation(delta);

  controls.update();
  renderer.render(scene, camera);
}

/* ─── UI CONTROLS ─── */
window.toggleOpt = function(opt) {
  const el = document.getElementById('toggle-' + opt);
  const on = !el.classList.contains('on');
  el.classList.toggle('on', on);

  if (opt === 'rotate') {
    autoRotate = on;
    controls.autoRotate = false;
  } else if (opt === 'cape') {
    showCape = on;
    if (capeMesh) capeMesh.visible = on;
  } else if (opt === 'slim') {
    toast('Slim: reload skin to apply');
  }
}

window.updateLight = function(type, val) {
  if (type === 'ambient') {
    const v = val / 100;
    document.getElementById('val-ambient').textContent = v.toFixed(1);
    const amb = scene.getObjectByName('ambient');
    if (amb) amb.intensity = v;
  } else if (type === 'point') {
    const v = val / 100;
    document.getElementById('val-point').textContent = v.toFixed(1);
    if (pointLight) pointLight.intensity = v;
  }
}

window.setLightColor = function(hex, name) {
  if (pointLight) pointLight.color.setStyle(hex);
  toast('Light: ' + name);
}

window.updateCamera = function(type, val) {
  if (type === 'zoom') {
    const v = parseInt(val);
    document.getElementById('val-zoom').textContent = v;
    camera.fov = v;
    camera.updateProjectionMatrix();
  } else if (type === 'speed') {
    animSpeed = val / 100;
    document.getElementById('val-speed').textContent = animSpeed.toFixed(1) + 'x';
  }
}

/* ─── LAYER EXPLODE ─── */
let layerOffsets = {};
window.explodeLayers = function(val) {
  const v = val / 100;
  document.getElementById('val-explode').textContent = val;
  if (!skinLoaded) return;

  // Explode outer layer meshes along their normals
  const parts = [
    { mesh: headMesh,      name: 'head',     dir: new THREE.Vector3(0, 1, 0) },
    { mesh: bodyMesh,      name: 'body',     dir: new THREE.Vector3(0, 0, 1) },
    { mesh: leftArmMesh,   name: 'left arm', dir: new THREE.Vector3(1, 0, 0) },
    { mesh: rightArmMesh,  name: 'right arm',dir: new THREE.Vector3(-1, 0, 0) },
    { mesh: leftLegMesh,   name: 'left leg', dir: new THREE.Vector3(0.4, -1, 0) },
    { mesh: rightLegMesh,  name: 'right leg',dir: new THREE.Vector3(-0.4,-1, 0) },
  ];

  parts.forEach(p => {
    if (!p.mesh) return;
    const outer = p.mesh.children[0];
    if (outer) {
      outer.position.copy(p.dir).multiplyScalar(v * 0.6);
    }
  });

  // update layer offset display
  document.querySelectorAll('.layer-offset').forEach((el, i) => {
    el.textContent = (v * 0.6).toFixed(2);
  });
}

function updateLayerList() {
  const list = document.getElementById('layer-list');
  const parts = [
    { name: 'HEAD (outer)',      color: '#FF6A00' },
    { name: 'BODY (outer)',      color: '#ff9944' },
    { name: 'RIGHT ARM (outer)', color: '#ffbb66' },
    { name: 'LEFT ARM (outer)',  color: '#ffcc88' },
    { name: 'RIGHT LEG (outer)', color: '#ff8833' },
    { name: 'LEFT LEG (outer)',  color: '#ff7722' },
  ];
  list.innerHTML = parts.map(p => `
    <div class="layer-item">
      <span class="layer-dot" style="border-color:${p.color};background:${p.color}22"></span>
      <span class="layer-name">${p.name}</span>
      <span class="layer-offset">0.00</span>
    </div>
  `).join('');
}

/* ─── MODE SWITCH ─── */
window.setMode = function(mode) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (mode === 'layers') {
    document.getElementById('layer-section').scrollIntoView({ behavior: 'smooth' });
  } else if (mode === 'debug') {
    toast('WebGL: ' + renderer.capabilities.isWebGL2 ? 'WebGL2' : 'WebGL1');
    setTimeout(() => toast('Max Tex: ' + renderer.capabilities.maxTextureSize + 'px'), 1200);
  }
}

/* ─── EXPORT PNG ─── */
window.exportPNG = function() {
  if (!skinLoaded) return toast('Load a skin first');
  renderer.render(scene, camera);
  const link = document.createElement('a');
  link.download = 'skin3d_render.png';
  link.href = renderer.domElement.toDataURL('image/png');
  link.click();
  toast('PNG saved!');
}

/* ─── UTILS ─── */
function setStatus(state, text) {
  const dot = document.getElementById('status-dot');
  dot.className = 'status-dot ' + state;
  document.getElementById('status-text').textContent = text;
}

let toastTimer;
window.toast = function(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// Enter key for username
document.getElementById('username-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadByUsername();
});

// INIT
init();
setStatus('', 'READY');
